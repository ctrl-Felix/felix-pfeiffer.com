name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DBMATE_SHA256: 4a3814fdb7253348d6b3cd60a2e315fba69e1a3a794a31ec75af2ca6019c835c
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - name: Install dbmate
        run: |
          curl -fsSL -o dbmate https://github.com/amacneil/dbmate/releases/download/v2.28.0/dbmate-linux-amd64
          echo "$DBMATE_SHA256  dbmate" | sha256sum -c -
          chmod +x dbmate
      - name: Create roles
        run: |
          PGPASSWORD=ci-superuser psql -v ON_ERROR_STOP=1 -U postgres -d portfolio \
            -v migrator_password=ci-migrator -v app_password=ci-app -f db/roles.sql
      - name: Migrate up, down, up
        env:
          DATABASE_URL: postgres://portfolio_migrator:ci-migrator@localhost:5432/portfolio?sslmode=disable
        run: |
          ./dbmate --no-dump-schema up
          ./dbmate --no-dump-schema rollback
          ./dbmate --no-dump-schema up
          ./dbmate --no-dump-schema status
      - name: App role has least privilege
        env:
          PGPASSWORD: ci-app
        run: |
          psql -v ON_ERROR_STOP=1 -U portfolio_app -d portfolio -c "insert into events (kind, target) values ('click', 'stocks')"
          psql -U portfolio_app -d portfolio -c "update events set target = 'x'" && exit 1 || true
          psql -U portfolio_app -d portfolio -c "delete from events" && exit 1 || true
          psql -U portfolio_app -d portfolio -c "drop table events" && exit 1 || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Validate and build compose stack
        env:
          DB_SUPERUSER_PASSWORD: placeholder
          DB_MIGRATOR_PASSWORD: placeholder
          DB_APP_PASSWORD: placeholder
        run: |
          docker compose config --quiet
          docker compose build db migrate
      - run: docker build -t portfolio-web .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  tld-coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check every TLD for a WHOIS or RDAP server
        run: npm run tld:update | tee -a "$GITHUB_STEP_SUMMARY"
      - id: diff
        run: |
          if git diff --quiet -- src/data/tldCoverage.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tld-coverage
          path: src/data/tldCoverage.json
          retention-days: 14

  tld-coverage-commit:
    needs: tld-coverage
    if: needs.tld-coverage.outputs.changed == 'true' && ((github.event_name == 'pull_request' && github.head_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
      - uses: actions/download-artifact@v4
        with:
          name: tld-coverage
          path: ${{ runner.temp }}/coverage
      - name: Validate and commit the coverage file to staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e 'type == "object" and length > 100 and all(to_entries[]; (.key | test("^[a-z0-9-]{2,63}$")) and (.value | type == "boolean"))' "$RUNNER_TEMP/coverage/tldCoverage.json" > /dev/null
          cp "$RUNNER_TEMP/coverage/tldCoverage.json" src/data/tldCoverage.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tldCoverage.json
          git commit -m "Update TLD coverage"
          git pull --rebase origin staging
          git push origin HEAD:staging
          gh workflow run ci.yml --ref staging
