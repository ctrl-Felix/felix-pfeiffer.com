name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep the npm audit result for the vulnerability tracker
        run: npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json" || true
      - uses: actions/upload-artifact@v7
        with:
          name: scan-npm-audit
          path: ${{ runner.temp }}/npm-audit.json
          retention-days: 7
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DBMATE_SHA256: 4a3814fdb7253348d6b3cd60a2e315fba69e1a3a794a31ec75af2ca6019c835c
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - name: Install dbmate
        run: |
          curl -fsSL -o dbmate https://github.com/amacneil/dbmate/releases/download/v2.28.0/dbmate-linux-amd64
          echo "$DBMATE_SHA256  dbmate" | sha256sum -c -
          chmod +x dbmate
      - name: Create roles
        run: |
          PGPASSWORD=ci-superuser psql -v ON_ERROR_STOP=1 -U postgres -d portfolio \
            -v migrator_password=ci-migrator -v app_password=ci-app -f db/roles.sql
      - name: Migrate up, down, up
        env:
          DATABASE_URL: postgres://portfolio_migrator:ci-migrator@localhost:5432/portfolio?sslmode=disable
        run: |
          ./dbmate --no-dump-schema up
          ./dbmate --no-dump-schema rollback
          ./dbmate --no-dump-schema up
          ./dbmate --no-dump-schema status
      - name: App role has least privilege
        env:
          PGPASSWORD: ci-app
        run: |
          psql -v ON_ERROR_STOP=1 -U portfolio_app -d portfolio -c "insert into events (kind, target) values ('click', 'profile')"
          psql -v ON_ERROR_STOP=1 -U portfolio_app -d portfolio -c "insert into events (kind, target) values ('mcp', 'whois_lookup')"
          psql -U portfolio_app -d portfolio -c "insert into events (kind, target) values ('mcp', null)" && exit 1 || true
          psql -U portfolio_app -d portfolio -c "update events set target = 'x'" && exit 1 || true
          psql -U portfolio_app -d portfolio -c "delete from events" && exit 1 || true
          psql -U portfolio_app -d portfolio -c "drop table events" && exit 1 || true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          output: ${{ runner.temp }}/codeql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-codeql
          path: ${{ runner.temp }}/codeql-results/*.sarif
          retention-days: 7
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Validate and build compose stack
        env:
          DB_SUPERUSER_PASSWORD: placeholder
          DB_MIGRATOR_PASSWORD: placeholder
          DB_APP_PASSWORD: placeholder
        run: |
          docker compose config --quiet
          docker compose build db migrate
      - run: docker build -t portfolio-web .
      - name: Keep the Trivy result for the vulnerability tracker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-web
          format: json
          output: trivy-image.json
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
      - uses: actions/upload-artifact@v7
        with:
          name: scan-trivy
          path: trivy-image.json
          retention-days: 7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portfolio-web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  tld-coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Run only when the last check is 7 days old or more
        id: due
        run: |
          last=$(jq -r '.lastRun // empty' src/data/tldCoverageRun.json 2>/dev/null || true)
          last_seconds=$(date -u -d "${last:-1970-01-01}" +%s 2>/dev/null || echo 0)
          if [ $(( $(date -u +%s) - last_seconds )) -lt 604800 ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "TLD coverage last checked on $last, less than 7 days ago. Skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.due.outputs.due == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.due.outputs.due == 'true'
        run: npm ci
      - name: Check every TLD for a WHOIS or RDAP server
        if: steps.due.outputs.due == 'true'
        run: npm run tld:update | tee -a "$GITHUB_STEP_SUMMARY"
      - id: diff
        if: steps.due.outputs.due == 'true'
        run: |
          if git diff --quiet -- src/data/tldCoverage.json src/data/tldCoverageRun.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tld-coverage
          path: |
            src/data/tldCoverage.json
            src/data/tldCoverageRun.json
          retention-days: 14

  vulnerability-record:
    needs: [quality, codeql, container]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: scan-*
          merge-multiple: true
          path: ${{ runner.temp }}/scans
      - name: Record real vulnerabilities and fail on CVSS 7.0 or higher
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          npm run --silent vulns:record -- --scans "$RUNNER_TEMP/scans" --pr "$PR_NUMBER" --fail-on-high | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 2 ]; then
            echo "::warning::The vulnerability recorder failed to run. Nothing was recorded."
            exit 0
          fi
          exit "$code"
      - id: diff
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- security/vulnerabilities)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - if: always() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vulnerabilities
          path: security/vulnerabilities/*.json
          retention-days: 14

  commit-generated:
    needs: [tld-coverage, vulnerability-record]
    if: always() && (needs.tld-coverage.outputs.changed == 'true' || needs.vulnerability-record.outputs.changed == 'true') && ((github.event_name == 'pull_request' && github.head_ref == 'staging' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging
      - uses: actions/download-artifact@v4
        if: needs.tld-coverage.outputs.changed == 'true'
        with:
          name: tld-coverage
          path: ${{ runner.temp }}/coverage
      - uses: actions/download-artifact@v4
        if: needs.vulnerability-record.outputs.changed == 'true'
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulns
      - name: Validate and commit the generated files to staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/coverage/tldCoverage.json" ]; then
            jq -e 'type == "object" and length > 100 and all(to_entries[]; (.key | test("^[a-z0-9-]{2,63}$")) and (.value | type == "boolean"))' "$RUNNER_TEMP/coverage/tldCoverage.json" > /dev/null
            cp "$RUNNER_TEMP/coverage/tldCoverage.json" src/data/tldCoverage.json
            git add src/data/tldCoverage.json
          fi
          if [ -f "$RUNNER_TEMP/coverage/tldCoverageRun.json" ]; then
            jq -e '(keys == ["lastRun"]) and (.lastRun | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$RUNNER_TEMP/coverage/tldCoverageRun.json" > /dev/null
            cp "$RUNNER_TEMP/coverage/tldCoverageRun.json" src/data/tldCoverageRun.json
            git add src/data/tldCoverageRun.json
          fi
          if [ -d "$RUNNER_TEMP/vulns" ]; then
            mkdir -p security/vulnerabilities
            for file in "$RUNNER_TEMP"/vulns/*.json; do
              name=$(basename "$file")
              echo "$name" | grep -Eq '^[0-9a-f]{12}\.json$'
              jq -e --arg name "$name" '(.id + ".json" == $name) and (.title | type == "string" and length > 0 and length <= 200) and (.explanation | type == "string" and length > 0 and length <= 1200) and (.severity | IN("critical", "high", "medium", "low")) and (.cvss.score | type == "number" and . > 0 and . <= 10) and (.scanner | IN("codeql", "npm-audit", "trivy")) and (.status | IN("open", "fixed")) and (.detected | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and (.url == null or (.url | test("^https://")))' "$file" > /dev/null
              cp "$file" "security/vulnerabilities/$name"
            done
            git add security/vulnerabilities
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated data: TLD coverage and vulnerability tracker"
          git pull --rebase origin staging
          git push origin HEAD:staging
          gh workflow run ci.yml --ref staging
