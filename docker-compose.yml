name: portfolio

x-hardened: &hardened
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *hardened
    build:
      context: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?Set DB_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *hardened
    build:
      context: ./db
      dockerfile: migrate.Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD}
    networks:
      - backend

  web:
    <<: *hardened
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_TO: ${CONTACT_TO:-}
    tmpfs:
      - /tmp
    networks:
      - frontend
      - backend

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  db-data: {}
